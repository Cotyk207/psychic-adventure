name: Build Windows EXE & Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Syntax check
        run: npm run check

      - name: Unit + integration tests
        run: npm test

      - name: Build renderer
        run: npm run build
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: UI + Fullstack + Android runtime smoke tests (jsdom)
        run: npm run smoke
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

  build:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: List Windows artifacts
        run: Get-ChildItem -Recurse release | Select-Object FullName, Length

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSYCHIC-Windows-Installer
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error
          retention-days: 30

  build-android:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Prepare web bundle & Capacitor Android assets
        run: npm run build:android
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Build signed Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :service-launcher:assembleRelease --no-daemon

      - name: Verify APK signature & stage release APK
        run: |
          VER=$(node -p "require('./package.json').version")
          mkdir -p release-android
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          APK_DST="release-android/PSYCHIC-Android-${VER}.apk"
          cp "$APK_SRC" "$APK_DST"
          APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "$APK_DST"
          for entry in chatgpt:ChatGPT claude:Claude gemini:Gemini perplexity:Perplexity copilot:Copilot arena:Arena; do
            flavor="${entry%%:*}"
            name="${entry#*:}"
            src="android/service-launcher/build/outputs/apk/${flavor}/release/service-launcher-${flavor}-release.apk"
            dst="release-android/PSYCHIC-${name}-Android-${VER}.apk"
            cp "$src" "$dst"
            "$APKSIGNER" verify --verbose "$dst"
          done
          ls -lh release-android/*.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSYCHIC-Android-APK
          path: release-android/*.apk
          if-no-files-found: error
          retention-days: 30

  build-service-launchers-windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build Arena Windows application
        run: npx electron-builder --win portable --config subscription-apps/arena-windows/builder.yml --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build independent service launchers
        shell: powershell
        run: ./subscription-apps/windows/build.ps1
      - name: Upload Windows service launchers
        uses: actions/upload-artifact@v4
        with:
          name: PSYCHIC-Service-Launchers-Windows
          path: release-web-apps-windows/*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-android, build-service-launchers-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: PSYCHIC-Windows-Installer
          path: dist-release

      - name: Download Android APK artifact
        uses: actions/download-artifact@v4
        with:
          name: PSYCHIC-Android-APK
          path: dist-release

      - name: Download Windows service launchers
        uses: actions/download-artifact@v4
        with:
          name: PSYCHIC-Service-Launchers-Windows
          path: dist-release

      - name: List all release files
        run: ls -lh dist-release

      - name: Publish GitHub Release (Windows EXE + Android APK)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*.exe
            dist-release/*.apk
            dist-release/latest.yml
          tag_name: ${{ github.ref_name }}
          name: PSYCHIC ${{ github.ref_name }} (Windows + Android)
          generate_release_notes: true
          draft: false
          prerelease: false
